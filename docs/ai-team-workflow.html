.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;ai-workflow-explainer&quot;&gt;
  &lt;style&gt;
    #ai-workflow-explainer {
      --role-pm: var(--viz-series-2);
      --role-doc: var(--viz-series-5);
      --role-team: var(--viz-series-3);
      --role-jira: var(--viz-series-4);
      --role-delivery: var(--viz-series-6);
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      color: var(--foreground);
    }

    #ai-workflow-explainer .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(240px, 0.7fr);
      gap: 24px;
      align-items: end;
      padding: 20px 0 4px;
      border-bottom: 1px solid var(--border);
    }

    #ai-workflow-explainer .eyebrow,
    #ai-workflow-explainer .section-kicker {
      color: var(--muted-foreground);
      font-weight: 500;
    }

    #ai-workflow-explainer .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #ai-workflow-explainer .hero p {
      max-width: 760px;
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .principle {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding-left: 16px;
      border-left: 3px solid var(--primary);
    }

    #ai-workflow-explainer .principle i {
      flex: 0 0 auto;
      margin-top: 3px;
      color: var(--primary);
    }

    #ai-workflow-explainer .principle strong,
    #ai-workflow-explainer .principle span {
      display: block;
    }

    #ai-workflow-explainer .principle span {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .phase-nav {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    #ai-workflow-explainer .phase-button {
      min-width: 0;
      padding: 9px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted-foreground);
      background: transparent;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    #ai-workflow-explainer .phase-button:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    #ai-workflow-explainer .phase-button[aria-current=&quot;step&quot;] {
      border-color: var(--primary);
      color: var(--primary-foreground);
      background: var(--primary);
    }

    #ai-workflow-explainer .phase-number {
      display: block;
      margin-bottom: 2px;
      font-weight: 500;
    }

    #ai-workflow-explainer .phase-label {
      display: block;
      overflow-wrap: anywhere;
    }

    #ai-workflow-explainer .progress-rail {
      position: relative;
      height: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--muted);
    }

    #ai-workflow-explainer .progress-fill {
      width: 0;
      height: 100%;
      background: var(--primary);
      transition: width 360ms ease;
    }

    #ai-workflow-explainer .stage-shell {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #ai-workflow-explainer .stage-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    #ai-workflow-explainer .stage-index {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #ai-workflow-explainer .stage-index .viz-badge {
      min-width: 72px;
      text-align: center;
    }

    #ai-workflow-explainer .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    #ai-workflow-explainer .controls .btn {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    #ai-workflow-explainer .actor-map {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      padding: 4px 0 16px;
    }

    #ai-workflow-explainer .actor-map::before {
      position: absolute;
      right: 8%;
      bottom: 46px;
      left: 8%;
      height: 1px;
      content: &quot;&quot;;
      background: var(--border);
    }

    #ai-workflow-explainer .actor {
      position: relative;
      z-index: 2;
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 5px;
      align-items: center;
      padding: 12px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      text-align: center;
      transition: background 240ms ease, border-color 240ms ease, transform 240ms ease;
    }

    #ai-workflow-explainer .actor-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 50%;
      color: var(--muted-foreground);
      background: var(--muted);
      transition: color 240ms ease, background 240ms ease;
    }

    #ai-workflow-explainer .actor strong {
      font-weight: 500;
    }

    #ai-workflow-explainer .actor span {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .actor.is-active {
      border-color: color-mix(in srgb, var(--actor-color) 45%, var(--border));
      background: color-mix(in srgb, var(--actor-color) 10%, transparent);
      transform: translateY(-3px);
    }

    #ai-workflow-explainer .actor.is-active .actor-icon {
      color: var(--background);
      background: var(--actor-color);
    }

    #ai-workflow-explainer .actor[data-actor=&quot;pm&quot;] { --actor-color: var(--role-pm); }
    #ai-workflow-explainer .actor[data-actor=&quot;doc&quot;] { --actor-color: var(--role-doc); }
    #ai-workflow-explainer .actor[data-actor=&quot;team&quot;] { --actor-color: var(--role-team); }
    #ai-workflow-explainer .actor[data-actor=&quot;jira&quot;] { --actor-color: var(--role-jira); }
    #ai-workflow-explainer .actor[data-actor=&quot;delivery&quot;] { --actor-color: var(--role-delivery); }

    #ai-workflow-explainer .flow-token {
      position: absolute;
      z-index: 3;
      bottom: 40px;
      left: calc(var(--token-index, 0) * 20% + 10%);
      width: 12px;
      height: 12px;
      border: 3px solid var(--background);
      border-radius: 50%;
      background: var(--primary);
      transform: translateX(-50%);
      transition: left 520ms cubic-bezier(.2, .8, .2, 1), background 240ms ease;
    }

    #ai-workflow-explainer .stage-content {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
      gap: 24px;
      min-height: 300px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    #ai-workflow-explainer .stage-main,
    #ai-workflow-explainer .stage-side {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 14px;
    }

    #ai-workflow-explainer .stage-heading {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    #ai-workflow-explainer .stage-heading-icon {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 6px;
      color: var(--primary);
      background: var(--accent);
    }

    #ai-workflow-explainer .stage-heading-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    #ai-workflow-explainer .stage-description {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .action-list,
    #ai-workflow-explainer .criteria-list,
    #ai-workflow-explainer .skeleton-list,
    #ai-workflow-explainer .overview-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #ai-workflow-explainer .action-list {
      display: grid;
      gap: 9px;
    }

    #ai-workflow-explainer .action-list li,
    #ai-workflow-explainer .criteria-list li {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    #ai-workflow-explainer .action-list i,
    #ai-workflow-explainer .criteria-list i {
      flex: 0 0 auto;
      margin-top: 3px;
      color: var(--viz-series-3);
    }

    #ai-workflow-explainer .meta-block {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    #ai-workflow-explainer .meta-block:first-child {
      padding-top: 0;
      border-top: 0;
    }

    #ai-workflow-explainer .meta-label {
      display: flex;
      gap: 7px;
      align-items: center;
      color: var(--muted-foreground);
      font-weight: 500;
    }

    #ai-workflow-explainer .artifact-name {
      overflow-wrap: anywhere;
      font-weight: 500;
    }

    #ai-workflow-explainer .gate-tag {
      display: inline-flex;
      width: fit-content;
      gap: 6px;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--primary);
      background: var(--accent);
      font-weight: 500;
    }

    #ai-workflow-explainer .criteria-list {
      display: grid;
      gap: 7px;
    }

    #ai-workflow-explainer .stage-content.is-updating {
      animation: workflow-stage-in 300ms ease both;
    }

    @keyframes workflow-stage-in {
      from { opacity: 0.35; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #ai-workflow-explainer .overview {
      display: none;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    #ai-workflow-explainer .overview.is-visible {
      display: grid;
    }

    #ai-workflow-explainer .overview-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 18px;
    }

    #ai-workflow-explainer .overview-list li {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    #ai-workflow-explainer .overview-list span:first-child {
      color: var(--primary);
      font-weight: 500;
    }

    #ai-workflow-explainer .overview-list strong,
    #ai-workflow-explainer .overview-list small {
      display: block;
    }

    #ai-workflow-explainer .overview-list small {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .authority-section,
    #ai-workflow-explainer .docs-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    #ai-workflow-explainer .section-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.8fr);
      gap: 24px;
      align-items: end;
    }

    #ai-workflow-explainer .section-heading &gt; div {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #ai-workflow-explainer .section-heading p {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .authority-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    #ai-workflow-explainer .authority-item {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 3px solid var(--item-color);
    }

    #ai-workflow-explainer .authority-item:nth-child(1) { --item-color: var(--role-doc); }
    #ai-workflow-explainer .authority-item:nth-child(2) { --item-color: var(--role-jira); }
    #ai-workflow-explainer .authority-item:nth-child(3) { --item-color: var(--role-delivery); }

    #ai-workflow-explainer .authority-item p {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .document-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #ai-workflow-explainer .document-switch .btn[aria-pressed=&quot;true&quot;] {
      color: var(--primary-foreground);
      background: var(--primary);
    }

    #ai-workflow-explainer .document-panel {
      display: none;
      grid-template-columns: minmax(250px, 0.7fr) minmax(0, 1.3fr);
      gap: 24px;
      align-items: start;
    }

    #ai-workflow-explainer .document-panel.is-visible {
      display: grid;
    }

    #ai-workflow-explainer .document-intro {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 12px;
    }

    #ai-workflow-explainer .document-intro p {
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .document-rule {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    #ai-workflow-explainer .document-rule i {
      flex: 0 0 auto;
      margin-top: 3px;
      color: var(--primary);
    }

    #ai-workflow-explainer .skeleton-list {
      display: grid;
      gap: 0;
      counter-reset: skeleton;
    }

    #ai-workflow-explainer .skeleton-list &gt; li {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      counter-increment: skeleton;
    }

    #ai-workflow-explainer .skeleton-list &gt; li::before {
      content: counter(skeleton, decimal-leading-zero);
      color: var(--primary);
      font-weight: 500;
    }

    #ai-workflow-explainer .skeleton-list strong,
    #ai-workflow-explainer .skeleton-list span {
      display: block;
    }

    #ai-workflow-explainer .skeleton-list span {
      margin-top: 2px;
      color: var(--muted-foreground);
    }

    #ai-workflow-explainer .closing-rule {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 16px 0 8px;
      border-top: 1px solid var(--border);
    }

    #ai-workflow-explainer .closing-rule div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    #ai-workflow-explainer .closing-rule strong {
      color: var(--primary);
    }

    #ai-workflow-explainer .closing-rule span {
      color: var(--muted-foreground);
    }

    @media (max-width: 820px) {
      #ai-workflow-explainer .hero,
      #ai-workflow-explainer .section-heading,
      #ai-workflow-explainer .stage-content,
      #ai-workflow-explainer .document-panel {
        grid-template-columns: 1fr;
      }

      #ai-workflow-explainer .phase-nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      #ai-workflow-explainer .overview-list,
      #ai-workflow-explainer .authority-grid {
        grid-template-columns: 1fr;
      }

      #ai-workflow-explainer .document-intro {
        position: static;
      }

      #ai-workflow-explainer .closing-rule {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      #ai-workflow-explainer {
        gap: 18px;
      }

      #ai-workflow-explainer .phase-nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #ai-workflow-explainer .actor-map {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #ai-workflow-explainer .actor-map::before,
      #ai-workflow-explainer .flow-token {
        display: none;
      }

      #ai-workflow-explainer .stage-toolbar {
        align-items: flex-start;
      }

      #ai-workflow-explainer .controls {
        width: 100%;
      }

      #ai-workflow-explainer .controls .btn {
        flex: 1 1 auto;
        justify-content: center;
      }

      #ai-workflow-explainer .closing-rule {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #ai-workflow-explainer *,
      #ai-workflow-explainer *::before,
      #ai-workflow-explainer *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  &lt;/style&gt;

          &lt;div class=&quot;stage-heading-copy&quot;&gt;
            &lt;span class=&quot;section-kicker&quot; id=&quot;stage-owner&quot;&gt;负责人：产品经理&lt;/span&gt;

    &lt;div class=&quot;overview&quot; id=&quot;workflow-overview&quot;&gt;
      &lt;span class=&quot;section-kicker&quot;&gt;12 步完整链路&lt;/span&gt;
      &lt;ol class=&quot;overview-list&quot; id=&quot;overview-list&quot;&gt;&lt;/ol&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;authority-section&quot; aria-labelledby=&quot;authority-title&quot;&gt;
    &lt;div class=&quot;section-heading&quot;&gt;
      &lt;div&gt;
        &lt;span class=&quot;section-kicker&quot;&gt;事实与决策边界&lt;/span&gt;
        &lt;h2 id=&quot;authority-title&quot;&gt;三个载体，各自只承担一种责任&lt;/h2&gt;
      &lt;/div&gt;
      &lt;p&gt;文档保存当前有效结论，Jira 保存问题和决策过程，交付产物保存可执行、可验证的实现约束。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;authority-grid&quot;&gt;
      &lt;article class=&quot;authority-item&quot;&gt;
        &lt;i data-lucide=&quot;book-open-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
        &lt;h3&gt;共识文档&lt;/h3&gt;
        &lt;p&gt;回答“业务应该是什么”。覆盖流程、状态、角色、权限、页面规则、字段定义和跨端差异，是 PM 负责维护的业务事实源。&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;authority-item&quot;&gt;
        &lt;i data-lucide=&quot;message-square-warning&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
        &lt;h3&gt;Jira 待确认项&lt;/h3&gt;
        &lt;p&gt;回答“哪里还不确定、由谁决策”。每条问题绑定文档版本、章节和规则编号，关闭前必须确认结论已经回写并向下传播。&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;authority-item&quot;&gt;
        &lt;i data-lucide=&quot;braces&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
        &lt;h3&gt;前后端契约文档&lt;/h3&gt;
        &lt;p&gt;回答“当前需求如何实现和对接”。包含接口、字段、异常、权限、数据模型和兼容性，是 FE 联调与 QA 接口测试的直接依据。&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;docs-section&quot; aria-labelledby=&quot;docs-title&quot;&gt;
    &lt;div class=&quot;section-heading&quot;&gt;
      &lt;div&gt;
        &lt;span class=&quot;section-kicker&quot;&gt;标准文档骨架&lt;/span&gt;
        &lt;h2 id=&quot;docs-title&quot;&gt;两层文档，分别约束业务与实现&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class=&quot;document-switch&quot; role=&quot;group&quot; aria-label=&quot;选择文档骨架&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-document=&quot;consensus&quot; aria-pressed=&quot;true&quot;&gt;模块共识文档&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-document=&quot;contract&quot; aria-pressed=&quot;false&quot;&gt;前后端契约文档&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;document-panel is-visible&quot; data-panel=&quot;consensus&quot;&gt;
      &lt;div class=&quot;document-intro&quot;&gt;
        &lt;h3&gt;模块共识文档&lt;/h3&gt;
        &lt;p&gt;覆盖一个业务模块的完整事实，面向 PM、BE、FE、QA。它不描述某一次技术实现，而是提供拆需求、评审和生成契约的共同依据。&lt;/p&gt;
        &lt;div class=&quot;document-rule&quot;&gt;
          &lt;i data-lucide=&quot;fingerprint&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;span&gt;业务规则使用稳定编号，并记录事实来源、当前结论和变更状态。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;document-rule&quot;&gt;
          &lt;i data-lucide=&quot;refresh-cw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;span&gt;评审和待确认项闭环后，结论必须回写正文，不能只停留在 Jira 评论中。&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;ol class=&quot;skeleton-list&quot;&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;文档元信息&lt;/strong&gt;&lt;span&gt;版本、日期、本版本变更、数据来源、历史变更摘要。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;文档结构总览&lt;/strong&gt;&lt;span&gt;章节、平台、页面或子模块覆盖范围。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;模块概述&lt;/strong&gt;&lt;span&gt;模块定位、范围、参与角色、页面与子模块清单。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;业务流程与状态机&lt;/strong&gt;&lt;span&gt;核心场景、正常流程、异常分支、状态定义和迁移矩阵。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;角色与权限矩阵&lt;/strong&gt;&lt;span&gt;操作权限、数据权限、入口可见性和跨端差异。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;字段业务定义&lt;/strong&gt;&lt;span&gt;字段语义、必填规则、来源、枚举和计算方式。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;业务规则清单&lt;/strong&gt;&lt;span&gt;稳定编号、规则描述、来源、变更状态和引用关系。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;枚举值与常量&lt;/strong&gt;&lt;span&gt;状态、类型、模式、第三方状态及系统常量。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;第三方对接&lt;/strong&gt;&lt;span&gt;外部系统、同步、回调、重试、失败处理和边界。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;未决项登记&lt;/strong&gt;&lt;span&gt;问题、负责人、阻断等级、状态、结论和回写位置。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;页面交互规范&lt;/strong&gt;&lt;span&gt;按平台列出页面编号、角色、功能、字段、操作、权限和数据范围。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;后端任务规范&lt;/strong&gt;&lt;span&gt;触发条件、处理范围、跳过条件、执行逻辑、异常和幂等性。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;端差异汇总&lt;/strong&gt;&lt;span&gt;功能支持、操作权限和数据可见范围对照。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;附录与版本记录&lt;/strong&gt;&lt;span&gt;页面清单、规则索引、版本、日期和变更说明。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;

    &lt;div class=&quot;document-panel&quot; data-panel=&quot;contract&quot;&gt;
      &lt;div class=&quot;document-intro&quot;&gt;
        &lt;h3&gt;前后端契约文档&lt;/h3&gt;
        &lt;p&gt;面向一个具体子需求，把共识文档中的业务结论转化为可开发、可联调、可测试的实现契约，由 BE 负责维护。&lt;/p&gt;
        &lt;div class=&quot;document-rule&quot;&gt;
          &lt;i data-lucide=&quot;link&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;span&gt;必须绑定共识文档版本、引用的业务规则编号和对应 Jira 子需求。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;document-rule&quot;&gt;
          &lt;i data-lucide=&quot;scan-search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;span&gt;正文只保留当前生效的最终口径；过程争议留在 Jira，关键决策进入“决策与踩坑”。&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;ol class=&quot;skeleton-list&quot;&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;需求概要&lt;/strong&gt;&lt;span&gt;需求链接、原型来源、共识版本、规则引用和后端目标。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;业务流程&lt;/strong&gt;&lt;span&gt;核心流程、状态流转和非技术语言的关键业务规则。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;接口清单&lt;/strong&gt;&lt;span&gt;接口名称、方法、路径，以及新增或变更状态。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;接口详情&lt;/strong&gt;&lt;span&gt;请求参数、响应字段、示例、异常、业务规则、权限与数据范围。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;数据库变更&lt;/strong&gt;&lt;span&gt;终态表结构、字段定义和 Migration 文件；无变化则省略。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;代码改动清单&lt;/strong&gt;&lt;span&gt;受影响模块、类、任务拆分和预估工时。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;BE 自决事项&lt;/strong&gt;&lt;span&gt;不改变产品语义的技术决策、依据和约束。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;协调事项&lt;/strong&gt;&lt;span&gt;未完成的跨模块、跨团队或第三方协作。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;澄清记录&lt;/strong&gt;&lt;span&gt;已解决问题与仍 pending 问题分开维护。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;变更记录&lt;/strong&gt;&lt;span&gt;最新在前，只说明做了什么以及为什么。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;文档自检记录&lt;/strong&gt;&lt;span&gt;仅保留当次自检，包括矛盾、遗漏和工时复核。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;TAPD／Jira 子任务&lt;/strong&gt;&lt;span&gt;任务创建后追加负责人、范围和状态。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;完成记录&lt;/strong&gt;&lt;span&gt;交付、验证、构建、发布和测试结果。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;li&gt;&lt;div&gt;&lt;strong&gt;决策与踩坑&lt;/strong&gt;&lt;span&gt;交付后沉淀可复用的关键决策、反例与工程经验。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer class=&quot;closing-rule&quot; aria-label=&quot;工作流治理原则&quot;&gt;
    &lt;div&gt;&lt;strong&gt;1 份&lt;/strong&gt;&lt;span&gt;业务事实源&lt;/span&gt;&lt;/div&gt;
